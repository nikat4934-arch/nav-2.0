<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section class="questions">
        <div class="container">
            <form action="">
                <h1>Payment form</h1>
                <p>Pls complete all required (*) fields.</p>
                <fieldset>
                    <legend>Title</legend>
                    <ul>
                        <li>
                            <label for="tittle_1">
                                <input type="radio" name="" id="tittle_1">
                                Ace
                            </label>
                        </li>
                        <li>
                            <label for="title_2">
                                <input type="radio" name="" id="title_2">
                                King
                            </label>
                        </li>
                        <li>
                            <label for="title_3">
                                <input type="radio" name="" id="title_3">
                                Queen
                            </label>
                        </li>
                    </ul>
                </fieldset>
                <p>
                    <label for="name">Name *:</label>
                    <input type="text" name="" id="name" required>
                </p>
                <p>
                    <label for="mail">Email *:</label>
                    <input type="email" name="" id="mail" required>
                </p>
                <p>
                    <label for="pwd">Password *:</label>
                    <input type="password" name="" id="pwd" required>
                </p>
                <section>
                    <h2>Payment information</h2>
                    <p>
                        <label for="card">
                            <span>Card type:</span>
                        </label>
                        <section id="card" name="user-card">
                            <option value="visa">Visa</option>
                            <option value="mc">Mastercard</option>
                            <option value="amex">American Express</option>
                        </section>
                    </p>
                    <p>
                        <label for="number">Card number *:</label>
                        <input type="number" name="" id="number" required>
                    </p>
                    <p>
                        <label for="expiration">Expiration date *:</label>
                        <input
                        type="text"
                        id="expiration"
                        required
                        placeholder="MM/YY"
                        pattern="^(0[1-9]|1[0-2])\/([0-9]{2})$"/>
                    </p>
                </section>
                <section>
                    <p>
                        <button type="submit">Validate the payment</button>
                    </p>
                </section>
            </form>
        </div>
    </section>
</body>
</html>
